[project]
name = "claude-bridge"
version = "0.9.0"
description = "Use your Claude Code setup with any LLM provider — transparent API translation proxy"
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.27"]

# Build backend exists so the src-layout package is editable-installable into the
# venv (hatchling is a build-time tool, not a runtime dependency). The runtime
# carries one dependency — httpx[http2] — for HTTP/2 + split-timeout streaming
# transport (D-RUNTIME-002 supersedes the former stdlib-only D-RUNTIME-001).
# Launchers run `python -m claude_bridge` with explicit PYTHONPATH=src; the venv
# supplies httpx and its h2 extra.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# --gremlin-no-coverage-filter: pytest-gremlins' coverage-guided test selection
# under-reports the kill rate here (its per-test map collapses toward one-test-per-line,
# marking mutants the full suite demonstrably kills as survivors). Full-suite-per-mutant
# is the correct measurement; harmless (a registered no-op) when --gremlins is inactive.
addopts = "--cov=claude_bridge --cov-report=term-missing --cov-fail-under=80 --gremlin-no-coverage-filter"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "basedpyright>=1.29",
    "pytest-gremlins>=1.8.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "import-linter>=2.13",
    "hypothesis>=6.165.10",
    "deptry>=0.25.1",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S603: launcher/isolation tests drive subprocess with sys.executable + fixed args (trusted input).
"tests/**/*.py" = ["S101", "S105", "S108", "S310", "S603"]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# Dead-code detection (vulture). ignore_names lists interface-required identifiers that
# are structurally unused but cannot be removed, so vulture reports them as 100%-confidence
# false positives: fp/newurl (the urllib redirect_request override that refuses
# token-endpoint redirects, CWE-918), kw (**kw catch-alls in test doubles), and format
# (the BaseHTTPRequestHandler.log_message override in the test HTTP servers). ignore_names
# is the only pyproject key that survives the runner's CLI; see DECISIONS.md D-QUALITY-001.
[tool.vulture]
ignore_names = ["fp", "newurl", "kw", "format"]

# Architecture-boundary contracts (import-linter). Encodes the one-way import DAG
# the proxy relies on: providers are self-contained and mutually independent, the
# proxy dispatches only through the provider abstraction, and leaf utilities never
# reach back into orchestration. Enforced by the boundary-map primitive gate.
[tool.importlinter]
root_package = "claude_bridge"

[[tool.importlinter.contracts]]
name = "Providers are mutually independent (no cross-provider imports)"
type = "independence"
modules = [
    "claude_bridge.providers.openai",
    "claude_bridge.providers.xai",
]

[[tool.importlinter.contracts]]
name = "Proxy dispatches via the provider abstraction, never concrete providers"
type = "forbidden"
source_modules = ["claude_bridge.proxy"]
forbidden_modules = [
    "claude_bridge.providers.openai",
    "claude_bridge.providers.xai",
]

[[tool.importlinter.contracts]]
name = "Leaf utilities never import orchestration"
type = "forbidden"
source_modules = [
    "claude_bridge.config",
    "claude_bridge.content",
    "claude_bridge.auth",
    "claude_bridge.stream",
    "claude_bridge.provider",
    "claude_bridge.stats",
    "claude_bridge.log",
    "claude_bridge.http_client",
    "claude_bridge.request_view",
]
forbidden_modules = [
    "claude_bridge.proxy",
    "claude_bridge.router",
    "claude_bridge.__main__",
    "claude_bridge.providers.openai",
    "claude_bridge.providers.xai",
]
